{% extends 'base.html' %}
{% block title %}Hồ sơ của tôi{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Hồ sơ của tôi</h1>

    <div class="card">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div class="grid sm:grid-cols-2 gap-4">
                {% for field in form %}
                <div class="{% if field.name == 'address' %}sm:col-span-2{% endif %}">
                    <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-xs text-red-500 mt-1">{{ field.errors|striptags }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <div class="pt-4 border-t flex justify-end">
                <button type="submit" class="btn-primary">Cập nhật thông tin</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
